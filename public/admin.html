<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAPP PTN — Admin</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:20px;background:#f7f4ec;color:#17263a}input,button{padding:10px;margin:5px}button{cursor:pointer}.row{background:#fff;padding:15px;margin:10px 0;border:1px solid #ddd}.row img{max-width:240px;display:block;margin:10px 0}</style></head><body><h1>SIAPP PTN — Admin</h1><div><input id="password" type="password" placeholder="Password admin"><button onclick="login()">Login</button></div><div id="status"></div><div id="list"></div><script>
let token = '';
const $ = id => document.getElementById(id);

async function login() {
  try {
    const response = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: $('password')?.value || ''})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.success !== true || !data.token) {
      $('status').textContent = data.message || 'Gagal login';
      return;
    }
    token = data.token;
    $('status').textContent = 'Login berhasil';
    await load();
  } catch (error) {
    $('status').textContent = 'Gagal terhubung ke server.';
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function load() {
  if (!token) return;
  try {
    const response = await fetch('/api/admin/payments', {
      headers: {'x-admin-token': token}
    });
    const rows = await response.json().catch(() => []);
    if (!response.ok || !Array.isArray(rows)) {
      $('status').textContent = 'Gagal memuat pembayaran.';
      return;
    }

    $('list').innerHTML = rows.map(x => {
      const requestId = escapeHtml(x.requestId);
      const statusText = escapeHtml(x.status);
      const amount = Number(x.amount);
      const proofUrl = String(x.proofUrl || '');
      return `<div class="row">
        <b>${requestId}</b><br>
        Status: ${statusText}<br>
        Nominal: Rp${Number.isFinite(amount) ? amount.toLocaleString('id-ID') : '0'}<br>
        <img src="${escapeHtml(proofUrl)}" onerror="this.style.display='none'">
        <button data-id="${requestId}" data-action="approve">Approve</button>
        <button data-id="${requestId}" data-action="reject">Reject</button>
      </div>`;
    }).join('');

    $('list').querySelectorAll('button[data-id]').forEach(button => {
      button.addEventListener('click', () => act(button.dataset.id, button.dataset.action));
    });
  } catch (error) {
    $('status').textContent = 'Gagal terhubung ke server.';
  }
}

async function act(id, action) {
  if (!token || !id || !['approve', 'reject'].includes(action)) return;
  try {
    const response = await fetch('/api/admin/payments/' + encodeURIComponent(id) + '/' + action, {
      method: 'POST',
      headers: {
        'x-admin-token': token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({message: 'Bukti pembayaran ditolak.'})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.success !== true) {
      $('status').textContent = data.message || 'Gagal mengubah status pembayaran.';
      return;
    }
    await load();
  } catch (error) {
    $('status').textContent = 'Gagal terhubung ke server.';
  }
}
</script></body></html>
